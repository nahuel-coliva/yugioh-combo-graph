name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controlla il motore (confronto con il riferimento)
        run: node test_engine.js
      - name: Scarica le immagini delle carte
        run: node tools/fetch_cards.js
      - name: Prepara il sito
        run: |
          mkdir _site
          cp -r index.html style.css app.js core.js cards.js decks img vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
